{% extends "base.html" %}
{% block content %}
<div class="auth-container glass-panel" style="max-width: 600px;">
    <h2>Farmer Registration</h2>
    <form method="POST" action="{{ url_for('auth.register_user') }}">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" required>
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" name="state" required>
            </div>
            <div class="form-group">
                <label>District</label>
                <input type="text" name="district" required>
            </div>
            <div class="form-group">
                <label>Specific Location (Village/City)</label>
                <input type="text" name="location" required>
            </div>
            <div class="form-group">
                <label>Preferred Language</label>
                <select name="preferred_language" required>
                    <option value="English">English</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Marathi">Marathi</option>
                    <option value="Kannada">Kannada</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Register as Farmer</button>
    </form>
    <p class="auth-links">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
</div>
{% endblock %}
